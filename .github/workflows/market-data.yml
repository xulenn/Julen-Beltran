name: market-data

# Refreshes the S&P 500 data shown on the site and publishes it to the `data` branch
# (a single force-pushed commit, so history never grows and `main` is never touched).
# The site reads https://raw.githubusercontent.com/<owner>/<repo>/data/{live,history}.json

on:
  schedule:
    - cron: '*/10 13-21 * * 1-5' # US market hours (UTC), every ~10 min. GitHub may delay runs.
    - cron: '35 22 * * 1-5'      # just after the close: final prints + fresh daily history
    - cron: '17 6 * * *'         # daily heartbeat
  workflow_dispatch:
    inputs:
      force_history:
        description: 'Re-download the full S&P 500 history even if it is fresh'
        type: boolean
        default: false

concurrency:
  group: market-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests
        run: node --test scripts/market-data.test.mjs

      - name: Restore previous data
        run: |
          mkdir -p out
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            git archive FETCH_HEAD | tar -x -C out
          fi
          ls -la out

      - name: Fetch market data
        id: fetch
        env:
          FORCE_HISTORY: ${{ inputs.force_history && '1' || '' }}
        run: node scripts/market-data.mjs out

      - name: Publish to data branch
        if: steps.fetch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b data
          git config user.name "market-data[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "market data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
