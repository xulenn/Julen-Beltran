name: probe-sec
# TEMPORARY: checks that SEC EDGAR's XBRL API is reachable from GitHub runners and inspects its layout.
on:
  push:
    branches: [claude/funny-hamilton-lwm0v7]
    paths: ['.github/workflows/probe-sec.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe SEC
        shell: bash
        continue-on-error: true
        run: |
          UA='Julen-Beltran-site/1.0 (+https://github.com/xulenn/Julen-Beltran)'
          curl -sSL -m 30 -A "$UA" -H 'Accept-Encoding: gzip' --compressed -o /tmp/t.json -w 'tickers http=%{http_code} size=%{size_download}B\n' https://www.sec.gov/files/company_tickers.json || echo curl-failed
          jq -c '[to_entries[] | .value | select(.ticker|IN("V","COIN","XOM","CVNA","KO","AAPL","AXP","MSFT","VG","MCO","BRK-B"))]' /tmp/t.json || true
          for entry in V:1403161 COIN:1679788 XOM:34088 CVNA:1690820 KO:21344 AAPL:320193; do
            t=${entry%%:*}; cik=$(printf '%010d' ${entry##*:})
            sleep 0.3
            code=$(curl -sSL -m 60 -A "$UA" --compressed -o /tmp/f_$t.json -w '%{http_code} %{size_download}B %{time_total}s' "https://data.sec.gov/api/xbrl/companyfacts/CIK$cik.json" || echo curl-failed)
            echo "== $t CIK$cik -> $code"
            jq -c --arg t "$t" '{entity: .entityName, ntags: (.facts["us-gaap"]|length), annual_counts: ([
               "Revenues","RevenueFromContractWithCustomerExcludingAssessedTax","RevenueFromContractWithCustomerIncludingAssessedTax","SalesRevenueNet","NetIncomeLoss","OperatingIncomeLoss","GrossProfit",
               "NetCashProvidedByUsedInOperatingActivities","PaymentsToAcquirePropertyPlantAndEquipment","PaymentsToAcquireProductiveAssets","StockholdersEquity","Assets","LongTermDebt","LongTermDebtNoncurrent","EarningsPerShareDiluted","WeightedAverageNumberOfDilutedSharesOutstanding","CashAndCashEquivalentsAtCarryingValue","Liabilities"
             ] | map(. as $k | {($k): (try (.facts["us-gaap"][$k].units | to_entries[0] | .value | map(select(.form=="10-K" and .fp=="FY")) | map(.end) | unique | length) catch 0)}) | add)}' /tmp/f_$t.json 2>/dev/null || true
          done
          echo '--- Visa revenue (RevenueFromContractWithCustomerExcludingAssessedTax) last rows'
          jq -c '.facts["us-gaap"].RevenueFromContractWithCustomerExcludingAssessedTax.units.USD | map(select(.form=="10-K" and .fp=="FY")) | sort_by(.end) | .[-8:][] | {start,end,val,fy,fp,form,filed,frame}' /tmp/f_V.json || true
          echo '--- Visa NetIncomeLoss last rows'
          jq -c '.facts["us-gaap"].NetIncomeLoss.units.USD | map(select(.form=="10-K" and .fp=="FY")) | sort_by(.end) | .[-6:][] | {start,end,val,fy,filed}' /tmp/f_V.json || true
          echo '--- Coinbase revenue tags present'
          jq -c '.facts["us-gaap"] | keys | map(select(test("Revenue")))' /tmp/f_COIN.json || true
          echo '--- Exxon revenue tags present'
          jq -c '.facts["us-gaap"] | keys | map(select(test("^Revenues$|SalesRevenue|RevenueFromContract")))' /tmp/f_XOM.json || true
