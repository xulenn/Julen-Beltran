name: probe-sources
# TEMPORARY: dry-runs the real fetch script against live Cboe data from a GitHub-hosted runner.
# Publishes nothing. Removed before the redesign ships.
on:
  push:
    branches: [claude/funny-hamilton-lwm0v7]
    paths: ['.github/workflows/probe.yml', 'scripts/market-data.mjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: node --test scripts/market-data.test.mjs 2>&1 | grep -E '^(# (tests|pass|fail)|not ok)'
      - name: Run 1 (real data)
        run: node scripts/market-data.mjs out
      - name: Inspect output
        run: |
          ls -la out
          echo '--- live.json'
          jq -c '{v, generated, source, nq: (.quotes|length), spx_date: .spx.date, spx_session: .spx.session, spx_prev: .spx.prev, n_intraday: (.spx.intraday.t|length), first_bar: [.spx.intraday.t[0], .spx.intraday.c[0]], last_bar: [.spx.intraday.t[-1], .spx.intraday.c[-1]]}' out/live.json
          jq -c '.quotes[] | {id, symbol, name, price, prev, change, pct, time, invert, spark_n: (.spark|length), spark_last: (.spark[-1])}' out/live.json
          echo '--- history.json'
          jq -c '{v, symbol, source, generated, upstream, n: (.d|length), first: [.d[0], .c[0]], last: [.d[-1], .c[-1]], spark_ids: (.sparks|keys)}' out/history.json
          echo '--- sessions.json'
          jq -c '{sessions: (.sessions|to_entries|map({date: .key, n: (.value.t|length)}))}' out/sessions.json
          python3 - <<'EOF'
          import json, datetime
          h = json.load(open('out/history.json'))
          d0 = datetime.date(1970,1,1)
          print('history range:', d0 + datetime.timedelta(days=h['d'][0]), '->', d0 + datetime.timedelta(days=h['d'][-1]))
          l = json.load(open('out/live.json'))
          for t in (l['spx']['session']['start'], l['spx']['session']['end'], l['spx']['intraday']['t'][0], l['spx']['intraday']['t'][-1], l['quotes'][0]['time']):
              print(t, datetime.datetime.fromtimestamp(t, datetime.timezone.utc).isoformat())
          EOF
      - name: Run 2 (should report no change)
        run: node scripts/market-data.mjs out
      - name: Payload sizes (gzip)
        run: |
          for f in out/*.json; do echo "$f raw=$(wc -c < $f) gzip=$(gzip -9 -c $f | wc -c)"; done
