name: probe-sources
# TEMPORARY: checks which market-data sources are reachable from GitHub-hosted runners.
on:
  push:
    branches: [claude/funny-hamilton-lwm0v7]
    paths: ['.github/workflows/probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe
        shell: bash
        run: |
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'
          probe() {
            name="$1"; shift
            echo; echo "=== $name"
            curl -sS -L -m 20 -o /tmp/body -D /tmp/hdr -A "$UA" -w 'RESULT http=%{http_code} time=%{time_total}s size=%{size_download}\n' "$@" 2>&1 || echo "RESULT curl-failed($?)"
            echo -n "ACAO: "; grep -i '^access-control-allow-origin' /tmp/hdr | head -1 || true; echo
            echo -n "BODY: "; head -c 260 /tmp/body | tr '\n\r' '  '; echo
          }
          probe yahoo_chart_q1 'https://query1.finance.yahoo.com/v8/finance/chart/%5EGSPC?range=5d&interval=1d'
          probe yahoo_chart_q2 'https://query2.finance.yahoo.com/v8/finance/chart/%5EGSPC?range=5d&interval=1d'
          probe yahoo_spark 'https://query1.finance.yahoo.com/v7/finance/spark?symbols=%5EGSPC,%5EIXIC&range=1mo&interval=1d'
          # cookie + crumb flow
          rm -f /tmp/jar; curl -s -m 15 -c /tmp/jar -A "$UA" -o /dev/null -w 'fc.yahoo.com http=%{http_code}\n' https://fc.yahoo.com || true
          CRUMB=$(curl -s -m 15 -b /tmp/jar -c /tmp/jar -A "$UA" https://query1.finance.yahoo.com/v1/test/getcrumb || true)
          echo "crumb length: ${#CRUMB}  (first chars: ${CRUMB:0:12})"
          probe yahoo_chart_crumb -b /tmp/jar "https://query1.finance.yahoo.com/v8/finance/chart/%5EGSPC?range=5d&interval=1d&crumb=${CRUMB}"
          probe stooq_daily 'https://stooq.com/q/d/l/?s=%5Espx&i=d'
          probe stooq_quote 'https://stooq.com/q/l/?s=%5Espx&f=sd2t2ohlcv&h&e=csv'
          probe fred_csv 'https://fred.stlouisfed.org/graph/fredgraph.csv?id=SP500'
          probe cboe_hist 'https://cdn.cboe.com/api/global/delayed_quotes/charts/historical/_SPX.json'
          probe cboe_intraday 'https://cdn.cboe.com/api/global/delayed_quotes/charts/intraday/_SPX.json'
          probe cboe_quote_head -r 0-600 'https://cdn.cboe.com/api/global/delayed_quotes/quotes/_SPX.json'
          probe nasdaq_info -H 'Accept: application/json' 'https://api.nasdaq.com/api/quote/SPX/info?assetclass=index'
          probe nasdaq_chart -H 'Accept: application/json' 'https://api.nasdaq.com/api/quote/SPX/chart?assetclass=index'
          probe alphavantage_demo 'https://www.alphavantage.co/query?function=TIME_SERIES_DAILY&symbol=IBM&apikey=demo&datatype=csv'
          probe twelvedata_demo 'https://api.twelvedata.com/time_series?symbol=SPX&interval=1day&outputsize=5&apikey=demo'
          probe datahub_monthly 'https://raw.githubusercontent.com/datasets/s-and-p-500/main/data/data.csv'
          probe stooq_alt_host 'https://stooq.pl/q/d/l/?s=%5Espx&i=d'
