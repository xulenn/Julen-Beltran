<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title translate="no">Page not found — Julen Beltran</title>
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="https://xulenn.github.io/Julen-Beltran/assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://xulenn.github.io/Julen-Beltran/assets/css/main.css" />
  <style>
    .nf { min-height: 100vh; min-height: 100svh; display: grid; place-content: center; justify-items: start; gap: 1.2rem; padding: 2rem var(--gutter); max-width: 44rem; margin: 0 auto; }
    .nf .code { font: 500 .78rem var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); }
    .nf h1 { font: 400 clamp(2.6rem, 8vw, 5rem)/1 var(--serif); letter-spacing: -.03em; }
    .nf h1 em { color: var(--accent); }
    .nf p { color: var(--ink-2); max-width: 32rem; }
    .nf svg { width: min(100%, 26rem); height: auto; margin-top: .5rem; }
    .nf path { fill: none; stroke: var(--warm); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <script>try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
</head>
<body>
  <main class="nf">
    <p class="code">404 · off the chart</p>
    <h1>That page <em>isn't here</em>.</h1>
    <p>The link may be old or mistyped. Here's a market that went somewhere unexpected instead.</p>
    <svg viewBox="0 0 400 90" aria-hidden="true"><path d="M2 70 C 30 66, 52 74, 80 58 S 130 44, 160 52 S 210 18, 246 30 S 300 8, 330 22 L 352 70 L 398 82" /></svg>
    <a class="btn btn-primary" href="https://xulenn.github.io/Julen-Beltran/">Back to the home page</a>
  </main>
</body>
</html>
